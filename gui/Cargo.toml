[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "SHCEcoSim"
path = "src/main.rs"

[dependencies]
simulator = { path = "../simulator" }
slint = { version = "=1.16.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.16.0"
winresource = "0.1"
